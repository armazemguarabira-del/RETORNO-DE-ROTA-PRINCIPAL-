# Workflow para compilar o Vite e publicar automaticamente no GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages e/ou branch gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

# Garante apenas uma implantação por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: |
          npm install --legacy-peer-deps

      - name: Compilar projeto (Vite Build)
        run: npm run build

      - name: Garantir .nojekyll e 404 fallback no dist
        run: |
          touch dist/.nojekyll
          if [ -f dist/index.html ] && [ ! -f dist/404.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Deploy universal na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: Configurar o GitHub Pages nativo
        id: pages_config
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload dos arquivos compilados (dist)
        id: pages_upload
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      - name: Deploy no GitHub Pages nativo
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

